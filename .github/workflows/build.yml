name: Build and playability checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual desktop
        run: |
          log="$RUNNER_TEMP/virtual-desktop.log"
          if { sudo apt-get -qq update && sudo apt-get -qq install -y xvfb libgl1-mesa-dri libglx-mesa0; } > "$log" 2>&1; then
            echo "Virtual desktop ready."
          else
            cat "$log"
            exit 1
          fi
      - name: Build, test, and check desktop controls
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          printf 'legacy-asset-index\n' > assets/assets.txt
          log="$RUNNER_TEMP/gradle.log"
          if xvfb-run -a ./gradlew --quiet --console=plain build lwjgl3:smokeTest > "$log" 2>&1; then
            echo "Build, tests, and desktop checks passed."
          else
            cat "$log"
            exit 1
          fi
      - name: Verify packaged assets
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          expected = Path('build/generated/assets/assets.txt').read_bytes()
          assert expected != Path('assets/assets.txt').read_bytes(), 'Generated index matches the legacy fixture'
          assert Path('lwjgl3/build/resources/main/assets.txt').read_bytes() == expected, 'Incorrect processed asset index'
          with ZipFile(next(Path('lwjgl3/build/libs').glob('*.jar'))) as archive:
              assert archive.namelist().count('assets.txt') == 1, 'Expected exactly one asset index in the JAR'
              assert archive.read('assets.txt') == expected, 'Unexpected asset index in the JAR'
              assert {'img.png', 'logo.png', 'fonts/DejaVuSans-Latin.ttf', 'fonts/LICENSE.txt'} <= set(archive.namelist()), 'Expected images and licensed font in the JAR'
          PYTHON
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-diagnostics
          if-no-files-found: ignore
          path: |
            core/build/reports/tests/test
            lwjgl3/build/reports/desktop-smoke*.png
